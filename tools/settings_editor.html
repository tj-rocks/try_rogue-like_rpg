<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Settings Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0b10;
            --surface: rgba(20, 22, 34, 0.7);
            --surface-bright: rgba(30, 35, 55, 0.9);
            --accent: #7c4dff;
            --accent-glow: rgba(124, 77, 255, 0.4);
            --text: #e0e0e6;
            --text-dim: #9499b0;
            --border: rgba(255, 255, 255, 0.08);
            --success: #00e676;
            --danger: #ff5252;
            --sidebar-width: 260px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(124, 77, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 230, 118, 0.03) 0%, transparent 40%);
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(15, 17, 26, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 0;
            z-index: 100;
        }

        .logo {
            padding: 0 24px 32px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-group { margin-bottom: 24px; }
        .nav-label {
            padding: 0 24px 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        .nav-item {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            color: var(--text-dim);
            font-weight: 500;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
        }

        .nav-item.active {
            background: rgba(124, 77, 255, 0.1);
            color: var(--accent);
            border-left-color: var(--accent);
        }

        /* Main Content */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            scroll-behavior: smooth;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 { font-size: 32px; font-weight: 700; }

        .actions { display: flex; gap: 12px; }

        .btn {
            padding: 10px 24px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text);
        }

        .btn-ghost:hover { background: rgba(255,255,255,0.05); }

        /* Section Cards */
        .section-header {
            margin: 40px 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--accent);
            font-weight: 600;
            font-size: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s;
        }

        .card:hover {
            border-color: rgba(124, 77, 255, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Inputs */
        .form-group { margin-bottom: 16px; }
        .label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        input[type="text"], input[type="number"], select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            width: 100%;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Item Specifics */
        .item-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item-title { font-weight: 600; font-size: 18px; }

        .item-preview {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px dashed var(--border);
        }

        .item-preview img {
            max-width: 80%;
            max-height: 80%;
            image-rendering: pixelated;
            object-fit: contain;
        }

        .tag {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            background: var(--accent);
            color: white;
            font-weight: 700;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            padding: 16px 32px;
            border-radius: 16px;
            background: var(--surface-bright);
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Utils */
        .hidden { display: none; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .btn-add {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
            font-size: 20px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-add:hover {
            transform: scale(1.1) rotate(90deg);
            background: var(--success);
        }
        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
            margin-left: 8px;
            opacity: 0.5;
            transition: all 0.2s;
            line-height: 1;
            vertical-align: middle;
        }
        .btn-delete:hover {
            opacity: 1;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">
            <span>🎮</span> Settings Engine
        </div>
        
        <div class="nav-group">
            <div class="nav-label">Core Settings</div>
            <div class="nav-item active" onclick="showTab('balance')">⚖️ Balance</div>
            <div class="nav-item" onclick="showTab('dungeon')">🏰 Dungeon</div>
        </div>

        <div class="nav-group">
            <div class="nav-label">Master Data</div>
            <div class="nav-item" onclick="showTab('enemies')">👹 Enemies</div>
            <div class="nav-item" onclick="showTab('equipment')">⚔️ Equipment</div>
            <div class="nav-item" onclick="showTab('items')">🧪 Items</div>
            <div class="nav-item" onclick="showTab('quests')">📜 Quests</div>
            <div class="nav-item" onclick="showTab('npcs')">👥 NPCs</div>
            <div class="nav-item" onclick="showTab('guild')">📜 Guild</div>
            <div class="nav-item" onclick="showTab('ui')">🎨 Aesthetics</div>
        </div>
    </nav>

    <div class="main">
        <header>
            <h1 id="tabTitle">Balance Settings</h1>
            <div class="actions">
                <button class="btn btn-ghost" onclick="fetchData()">🔄 Reload</button>
                <button class="btn btn-primary" onclick="saveData()">💾 Save All</button>
            </div>
        </header>

        <div id="content">
            <!-- Dynamic Content Here -->
        </div>
    </div>

    <div id="toast">
        <span id="toastIcon">✅</span>
        <span id="toastMsg">Saved successfully!</span>
    </div>

    <!-- Datalists for assets -->
    <datalist id="list_pictures_files"></datalist>
    <datalist id="list_pictures_dirs"></datalist>
    <datalist id="list_sounds_files"></datalist>

    <script>
        let masterData = {};
        let assetsData = { pictures: { files: [], dirs: [] }, sounds: { files: [], dirs: [] } };
        let currentTab = 'balance';

        const SCHEMAS = {
            enemies: {
                title: "Enemy Bestiary",
                type: "complex",
                fields: {
                    name: "text",
                    rank: "select:F,E,D,C,B,A,S,SS",
                    hp: "number",
                    attack: "number",
                    attack_range: "number",
                    attack_effect: "select:physical_light,physical_heavy,fireball,dark_bolt,arrow,sonic_wave",
                    status_to_inflict: "select:none,poison,paralysis,sleep",
                    status_chance: "number",
                    dash_distance: "number",
                    stupidity: "number",
                    exp: "number",
                    min_floor: "number",
                    max_floor: "number",
                    image_folder: "path_dir",
                    sound: "path_sound"
                }
            },
            equipment: {
                title: "Equipment Inventory",
                type: "complex_groups",
                groups: ["WEAPON_DATA", "ARMOR_DATA", "SHIELD_DATA"],
                fields: {
                    name: "text",
                    price: "number",
                    rarity: "number",
                    image_path: "path_img",
                    image_dir: "path_dir",
                    describe: "text"
                }
            },
            items: {
                title: "Consumables & Staves",
                type: "complex_groups",
                groups: ["CONSUMABLE_DATA", "STAVE_DATA"],
                fields: {
                    name: "text",
                    price: "number",
                    charges: "number",
                    amount: "number",
                    rarity: "number",
                    image_path: "path_img",
                    describe: "text"
                }
            },
            balance: {
                title: "Game Balance",
                type: "nested"
            },
            quests: {
                title: "Quests & Missions",
                type: "complex_groups",
                groups: ["FIXED_QUESTS", "REPEATABLE_QUESTS"],
                fields: {
                    title: "text",
                    type: "select:hunt,delivery",
                    target_key: "text",
                    amount: "number",
                    reward_gold: "number",
                    reward_gp: "number",
                    min_rank: "select:-,F,E,D,C,B,A,S,SS",
                    max_rank: "select:-,F,E,D,C,B,A,S,SS"
                }
            },
            dungeon: {
                title: "Dungeon Parameters",
                type: "mixed"
            },
            npcs: {
                title: "NPC Management",
                type: "complex",
                fields: {
                    name: "text",
                    image_path: "path_dir",
                    base_tile: "text"
                }
            },
            guild: {
                title: "Guild Ranks",
                type: "complex_groups",
                groups: ["GUILD_RANKS"],
                fields: {
                    rank: "text",
                    required_gp: "number",
                    reward_multiplier: "number"
                }
            },
            ui: {
                title: "UI Aesthetics",
                type: "nested"
            }
        };

        async function fetchData() {
            const [resData, resAssets] = await Promise.all([
                fetch('/api/data').then(r => r.json()),
                fetch('/api/assets').then(r => r.json())
            ]);
            masterData = resData;
            assetsData = resAssets;
            updateDatalists();
            render();
        }

        function updateDatalists() {
            const picFiles = document.getElementById('list_pictures_files');
            picFiles.innerHTML = assetsData.pictures.files.map(f => `<option value="${f}">`).join('');
            
            const picDirs = document.getElementById('list_pictures_dirs');
            picDirs.innerHTML = assetsData.pictures.dirs.map(d => `<option value="${d}">`).join('');
            
            const soundFiles = document.getElementById('list_sounds_files');
            soundFiles.innerHTML = assetsData.sounds.files.map(f => `<option value="${f}">`).join('');
        }

        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.innerText.toLowerCase().includes(tab));
            });
            document.getElementById('tabTitle').innerText = tab.charAt(0).toUpperCase() + tab.slice(1) + " Settings";
            render();
        }

        function render() {
            const container = document.getElementById('content');
            container.innerHTML = '';
            const data = masterData[currentTab];
            const schema = SCHEMAS[currentTab];
            
            if (!data || !schema) {
                container.innerHTML = `<div style="padding:40px; text-align:center; opacity:0.5;">データが見つかりません (${currentTab})</div>`;
                return;
            }

            if (schema.type === 'complex') renderComplex(container, data, schema);
            else if (schema.type === 'complex_groups') renderComplexGroups(container, data, schema);
            else if (schema.type === 'mixed') renderDungeon(container, data);
            else if (schema.type === 'nested') renderNested(container, data);
            else renderNested(container, data);
        }

        function renderComplex(container, data, schema) {
            const h = document.createElement('div');
            h.className = 'section-header';
            h.innerHTML = `<span>${schema.title}</span><button class="btn-add" onclick="addNewItem(null, '${currentTab}')">+</button>`;
            container.appendChild(h);

            const grid = document.createElement('div');
            grid.className = 'grid';
            for (let id in data) {
                grid.appendChild(createItemCard(null, id, data[id], schema.fields));
            }
            container.appendChild(grid);
        }

        function renderComplexGroups(container, data, schema) {
            schema.groups.forEach(groupName => {
                const h = document.createElement('div');
                h.className = 'section-header';
                h.innerHTML = `<span>${groupName}</span><button class="btn-add" onclick="addNewItem('${groupName}', '${currentTab}')">+</button>`;
                container.appendChild(h);

                const grid = document.createElement('div');
                grid.className = 'grid';
                const groupData = data[groupName] || {};
                for (let id in groupData) {
                    grid.appendChild(createItemCard(groupName, id, groupData[id], schema.fields));
                }
                container.appendChild(grid);
            });
        }

        function renderDungeon(container, data) {
             const h = document.createElement('div');
             h.className = 'section-header';
             h.innerText = "Dungeon Visuals & Rules";
             container.appendChild(h);
             
             const grid = document.createElement('div');
             grid.className = 'grid';
             
             // Traps
             if (data.TRAP_DATA) {
                 for (let id in data.TRAP_DATA) {
                     grid.appendChild(createItemCard('TRAP_DATA', id, data.TRAP_DATA[id], {
                         name: "text",
                         damage: "number",
                         weight: "number",
                         image_path: "path_img"
                     }));
                 }
             }
             container.appendChild(grid);

             // Floor Visuals & BGM
             if (data.DUNGEON_IMAGES) {
                 const h2 = document.createElement('div');
                 h2.className = 'section-header';
                 h2.innerText = "Floor Visuals & BGM";
                 container.appendChild(h2);
                 
                 const grid2 = document.createElement('div');
                 grid2.className = 'grid';
                 for (let floor in data.DUNGEON_IMAGES) {
                     if (floor === 'path' || floor === 'bgm_path') continue;
                     grid2.appendChild(createItemCard('DUNGEON_IMAGES', floor, data.DUNGEON_IMAGES[floor], {
                         image: "text",
                         sound: "path_sound",
                         brightness: "number",
                         map: "text"
                     }));
                 }
                 grid2.style.marginBottom = "40px";
                 container.appendChild(grid2);
             }
        }

        function renderNested(container, data) {
            const renderObject = (obj, parentKey = '', targetContainer) => {
                const grid = document.createElement('div');
                grid.className = 'grid';
                for (let key in obj) {
                    const fullKey = parentKey ? `${parentKey}.${key}` : key;
                    if (typeof obj[key] === 'object' && !Array.isArray(obj[key])) {
                        const h = document.createElement('div');
                        h.className = 'section-header';
                        h.style.marginTop = '30px';
                        h.innerHTML = `<span>${key.toUpperCase()}</span>`;
                        targetContainer.appendChild(h);
                        const subContainer = document.createElement('div');
                        targetContainer.appendChild(subContainer);
                        renderObject(obj[key], fullKey, subContainer);
                    } else {
                        const card = document.createElement('div');
                        card.innerHTML = `
                            <div class="label">${key}</div>
                            <div style="display:flex; gap:4px;">
                                <input type="${typeof obj[key] === 'number' ? 'number' : 'text'}" 
                                       value='${valueDisplay}' 
                                       onchange="updateNestedValue('${fullKey}', this.value)" style="flex:1">
                                ${ (key.includes('path') || key.includes('dir')) ? `<button class="btn" style="padding:4px 8px" onclick="triggerUploadNested('${fullKey}')">📁</button>` : '' }
                            </div>
                        `;
                        grid.appendChild(card);
                    }
                }
                if (grid.children.length > 0) targetContainer.appendChild(grid);
            };
            renderObject(data, '', container);
        }

        async function triggerUpload(group, id, key) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async () => {
                if (input.files.length > 0) {
                    const formData = new FormData();
                    formData.append('file', input.files[0]);
                    const res = await fetch('/api/upload', { method: 'POST', body: formData });
                    const result = await res.json();
                    if (result.ok) {
                        updateComplexValue(group, id, key, result.path);
                        render();
                    } else {
                        alert("Upload failed: " + result.message);
                    }
                }
            };
            input.click();
        }

        async function triggerUploadNested(fullKey) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async () => {
                if (input.files.length > 0) {
                    const formData = new FormData();
                    formData.append('file', input.files[0]);
                    const res = await fetch('/api/upload', { method: 'POST', body: formData });
                    const result = await res.json();
                    if (result.ok) {
                        updateNestedValue(fullKey, result.path);
                        render();
                    } else {
                        alert("Upload failed: " + result.message);
                    }
                }
            };
            input.click();
        }

        function createItemCard(group, id, item, fields) {
            const card = document.createElement('div');
            card.className = 'card item-card';
            
            let html = `
                <div class="item-header">
                    <div class="item-title">${item.name || id}</div>
                    <div class="tag">${id} <button class="btn-delete" title="削除" onclick="deleteItem('${group}', '${id}')">×</button></div>
                </div>
            `;

            let imgPath = item.image_path || item.image_folder || item.image_dir;
            if (!imgPath && item.image && currentTab === 'dungeon') {
                imgPath = masterData.dungeon.DUNGEON_IMAGES.path + "/" + item.image;
            }
            if (imgPath) {
                html += `
                    <div class="item-preview">
                        <img src="/img?path=${imgPath}" alt="preview">
                    </div>
                `;
            }

            for (let f in fields) {
                if (item[f] === undefined) continue;
                const type = fields[f];
                html += `<div class="form-group"><div class="label">${f}</div>`;
                if (type.startsWith('select')) {
                    const options = type.split(':')[1].split(',');
                    html += `<select onchange="updateComplexValue('${group}', '${id}', '${f}', this.value)">
                        ${options.map(o => `<option value="${o}" ${item[f] === o ? 'selected' : ''}>${o}</option>`).join('')}
                    </select>`;
                } else if (type === 'number') {
                    html += `<input type="number" value="${item[f]}" onchange="updateComplexValue('${group}', '${id}', '${f}', parseFloat(this.value))">`;
                } else if (type.startsWith('path')) {
                    let listId = 'list_pictures_files';
                    if (type === 'path_dir') listId = 'list_pictures_dirs';
                    if (type === 'path_sound') listId = 'list_sounds_files';
                    html += `
                        <div style="display:flex; gap:4px;">
                            <input type="text" value="${item[f] || ''}" list="${listId}" onchange="updateComplexValue('${group}', '${id}', '${f}', this.value); render();" style="flex:1">
                            <button class="btn" style="padding:4px 8px" onclick="triggerUpload('${group}', '${id}', '${f}')">📁</button>
                        </div>`;
                } else if (f === 'describe') {
                    html += `<textarea onchange="updateComplexValue('${group}', '${id}', '${f}', this.value)" style="width:100%; height:80px; background:rgba(0,0,0,0.2); color:white; border:1px solid var(--border); border-radius:8px; padding:8px; font-family:inherit;">${item[f] || ''}</textarea>`;
                } else {
                    html += `<input type="text" value="${item[f] || ''}" onchange="updateComplexValue('${group}', '${id}', '${f}', this.value)">`;
                }
                html += `</div>`;
            }
            
            card.innerHTML = html;
            return card;
        }


        function updateNestedValue(path, val) {
            const parts = path.split('.');
            let current = masterData[currentTab];
            for (let i = 0; i < parts.length - 1; i++) {
                current = current[parts[i]];
            }
            const lastKey = parts[parts.length - 1];
            
            // 型推論と値のパース
            if (typeof val === 'string') {
                const trimmed = val.trim();
                if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
                    try { current[lastKey] = JSON.parse(trimmed); } catch(e) { current[lastKey] = trimmed; }
                } else if (trimmed !== '' && !isNaN(trimmed)) {
                    current[lastKey] = parseFloat(trimmed);
                } else if (trimmed.toLowerCase() === 'true') {
                    current[lastKey] = true;
                } else if (trimmed.toLowerCase() === 'false') {
                    current[lastKey] = false;
                } else {
                    current[lastKey] = trimmed;
                }
            } else {
                current[lastKey] = val;
            }
        }

        function updateComplexValue(group, id, key, val) {
            const tabData = masterData[currentTab];
            if (group && group !== 'null' && group !== currentTab) {
                if (!tabData[group]) tabData[group] = {};
                if (!tabData[group][id]) tabData[group][id] = {};
                tabData[group][id][key] = val;
            } else {
                if (!tabData[id]) tabData[id] = {};
                tabData[id][key] = val;
            }
        }

        function addNewItem(group, tab) {
            const id = prompt("新しいIDを入力してください (例: slime_boss):");
            if (!id) return;

            const schema = SCHEMAS[tab];
            const newItem = {};
            for (let f in schema.fields) {
                const type = schema.fields[f];
                if (type === 'number') newItem[f] = 0;
                else if (type.startsWith('select')) newItem[f] = type.split(':')[1].split(',')[0];
                else newItem[f] = "";
            }
            newItem.name = id;

            const tabData = masterData[tab];
            if (group && group !== 'null') {
                if (!tabData[group]) tabData[group] = {};
                tabData[group][id] = newItem;
            } else {
                tabData[id] = newItem;
            }
            render();
        }

        function deleteItem(group, id) {
            if (!confirm(`本当に「${id}」を削除しますか？`)) return;
            const tabData = masterData[currentTab];
            if (group && group !== 'null') {
                delete tabData[group][id];
            } else {
                delete tabData[id];
            }
            render();
        }

        async function saveData() {
            const res = await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(masterData)
            });
            const result = await res.json();
            showToast(result.message, result.ok);
        }

        function showToast(msg, ok) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').innerText = ok ? '✅' : '❌';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        fetchData();
    </script>
</body>
</html>

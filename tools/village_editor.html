<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>🏡 村マップエディタ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

header { background: #16213e; padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #0f3460; flex-shrink: 0; }
header h1 { font-size: 16px; color: #e94560; }
.btn { padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: bold; transition: opacity .2s; }
.btn:hover { opacity: .8; }
.btn-blue  { background: #0f3460; color: #fff; }
.btn-green { background: #2d6a4f; color: #fff; }
.btn-red   { background: #c1121f; color: #fff; }
.btn-gold  { background: #b5803a; color: #fff; }

.main { display: flex; flex: 1; overflow: hidden; }

/* 左パネル: テキスト入力 */
.panel-left { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 2px solid #0f3460; background: #16213e; }
.panel-left h2 { padding: 8px 10px; font-size: 13px; color: #a8dadc; border-bottom: 1px solid #0f3460; }
#raw-text { flex: 1; background: #0d0d1a; color: #90ee90; font-size: 10px; padding: 8px; border: none; resize: none; outline: none; white-space: pre; overflow: auto; }
.panel-left-buttons { padding: 6px; display: flex; gap: 6px; border-top: 1px solid #0f3460; flex-wrap: wrap; }

/* 中央: マップ表示 */
.panel-center { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.panel-center h2 { padding: 8px 10px; font-size: 13px; color: #a8dadc; border-bottom: 1px solid #0f3460; background: #16213e; flex-shrink: 0; }
#map-container { flex: 1; overflow: auto; padding: 10px; background: #111; }
#map-grid { display: inline-block; line-height: 0; border: 1px solid #333; }

/* 右パネル: パレット + 凡例 */
.panel-right { width: 200px; flex-shrink: 0; background: #16213e; border-left: 2px solid #0f3460; overflow-y: auto; }
.panel-right h2 { padding: 8px 10px; font-size: 13px; color: #a8dadc; border-bottom: 1px solid #0f3460; }
.palette-section { padding: 6px 8px; }
.palette-section h3 { font-size: 11px; color: #888; margin-bottom: 4px; margin-top: 6px; text-transform: uppercase; }
.palette-grid { display: flex; flex-wrap: wrap; gap: 3px; }
.pal-item { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; cursor: pointer; border: 2px solid transparent; border-radius: 3px; transition: border-color .15s; }
.pal-item:hover { border-color: #fff; }
.pal-item.selected { border-color: #e94560; }

/* セル */
.cell { width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; cursor: pointer; vertical-align: top; user-select: none; transition: filter .1s; }
.cell:hover { filter: brightness(1.4); outline: 1px solid rgba(255,255,255,.5); }

/* ステータスバー */
#status-bar { background: #0d0d1a; padding: 3px 10px; font-size: 11px; color: #666; border-top: 1px solid #0f3460; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <h1>🏡 村マップエディタ</h1>
  <button class="btn btn-blue"  onclick="renderFromText()">▶ テキスト→描画</button>
  <button class="btn btn-green" onclick="exportToText()">💾 描画→テキスト</button>
  <button class="btn btn-gold"  onclick="copyText()">📋 クリップボードへ</button>
  <button class="btn btn-red"   onclick="clearAll()">🗑 クリア</button>
  <span style="margin-left:auto;font-size:11px;color:#666;">選択中: <span id="selected-char-disp" style="color:#e94560;font-weight:bold;">.</span></span>
</header>

<div class="main">
  <!-- 左: テキスト -->
  <div class="panel-left">
    <h2>📄 village.txt テキスト</h2>
    <textarea id="raw-text" spellcheck="false" placeholder="village.txtの内容をここに貼り付けてください..."></textarea>
    <div class="panel-left-buttons">
      <button class="btn btn-blue" onclick="loadFile()">📂 ファイル読込</button>
      <input type="file" id="file-input" style="display:none" accept=".txt" onchange="onFileLoad(event)">
    </div>
  </div>

  <!-- 中央: マップ -->
  <div class="panel-center">
    <h2 id="map-title">🗺 マップビュー（61×n グリッド）&nbsp;<span style="font-size:11px;color:#555;">クリックで配置、右クリックで消去</span></h2>
    <div id="map-container">
      <div id="map-grid"></div>
    </div>
    <div id="status-bar">行: - 列: - 文字: -</div>
  </div>

  <!-- 右: パレット -->
  <div class="panel-right">
    <h2>🎨 パレット</h2>
    <div class="palette-section">
      <h3>床・通路</h3>
      <div class="palette-grid" id="palette"></div>
    </div>
  </div>
</div>

<script>
// =============================================
// タイル定義 (文字 → [背景色, 前景色, ラベル])
// =============================================
const TILE = {
  // 床
  '.': ['#1c2a1c','#3a5a3a','.',   '外床'],
  ',': ['#2a2a1a','#6a6a2a',',',   '内床'],
  '~': ['#1a2a3a','#4a8aaa','~',   '水'],
  '_': ['#2a1a0a','#6a4a2a','_',   '砂'],
  // 壁天井
  'a': ['#3a2a1a','#8a6a4a','a',   '壁(0)'],
  'd': ['#3a1a1a','#aa5a3a','d',   '扉壁'],
  'm': ['#1a1a3a','#4a4a8a','m',   'D壁'],
  // 虚無
  ';': ['#0d0d0d','#333',  ';',   '虚無'],
  // 通路
  'K': ['#2a1a2a','#cc88cc','K',   '通路'],
  'L': ['#2a1a2a','#cc88cc','L',   '通路'],
  // 特殊
  'D': ['#cc2244','#fff',  'D',   'ダンジョン'],
  'P': ['#2244cc','#fff',  'P',   'プレイヤー開始'],
  // NPC施設
  'G': ['#4a2a00','#ffaa00','G',  'ギルド'],
  '$': ['#004a1a','#00ff88','$',  '銀行'],
  'R': ['#3a0a3a','#ee88ff','R',  '診療所'],
  'W': ['#4a0000','#ff6666','W',  '武器屋'],
  'I': ['#003a4a','#66bbff','I',  '道具屋'],
  'C': ['#3a3a00','#ffff66','C',  '商人'],
  'H': ['#002a4a','#66aaff','H',  '宿屋'],
  'B': ['#3a1a00','#ff8833','B',  '鍛冶屋'],
  'S': ['#002a2a','#66ffdd','S',  '預かり屋'],
  // チュートリアルNPC
  'A': ['#3a1a1a','#ff9999','A',  'A武器案内'],
  'E': ['#1a3a3a','#99eeff','E',  'E道具案内'],
  'F': ['#3a3a1a','#eeee99','F',  'F換金'],
  'J': ['#1a3a1a','#99ffbb','J',  'J倉庫管理'],
  'M': ['#1a1a3a','#9999ff','M',  'M宿屋娘'],
  'N': ['#3a2a1a','#ffbb88','N',  'N鍛冶助'],
  'Q': ['#3a2a00','#ffcc55','Q',  'Qギルド受付'],
  'T': ['#2a1a2a','#dd88ff','T',  'T医療助手'],
  '!': ['#1a3a1a','#88ffaa','!',  '!銀行窓口'],
  '@': ['#1a2a3a','#88ccff','@',  '@見習い'],
  '?': ['#2a2a1a','#ffee88','?',  '?案内'],
  '>': ['#3a0a2a','#ff88cc','>',  '>大魔導士'],
  '&': ['#2a1a3a','#ccaaff','&',  '&博士'],
};

const DEFAULT_TILE = ['#111','#555','.',''];
let mapData = []; // 2D array of chars
let selectedChar = '.';
let isMouseDown = false;

// =============================================
// パレット生成
// =============================================
function buildPalette() {
  const grid = document.getElementById('palette');
  grid.innerHTML = '';
  Object.entries(TILE).forEach(([ch, [bg, fg, label, desc]]) => {
    const div = document.createElement('div');
    div.className = 'pal-item';
    div.title = `${ch}: ${desc}`;
    div.textContent = ch;
    div.style.background = bg;
    div.style.color = fg;
    div.dataset.ch = ch;
    div.onclick = () => selectChar(ch);
    grid.appendChild(div);
  });
}

function selectChar(ch) {
  selectedChar = ch;
  document.getElementById('selected-char-disp').textContent = ch;
  document.querySelectorAll('.pal-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.ch === ch);
  });
}

// =============================================
// テキスト → マップデータ → 描画
// =============================================
function renderFromText() {
  const text = document.getElementById('raw-text').value;
  const lines = text.split('\n');
  mapData = [];
  lines.forEach(line => {
    if (line.startsWith('//')) return; // コメント行はスキップ
    if (line.trim() === '') {
      // 空行も保持しない（コメント外の空行はスキップ）
      return;
    }
    mapData.push(Array.from(line.replace(/\r/,'')));
  });
  drawGrid();
}

function drawGrid() {
  const grid = document.getElementById('map-grid');
  grid.innerHTML = '';
  if (mapData.length === 0) return;

  mapData.forEach((rowArr, ri) => {
    const rowDiv = document.createElement('div');
    rowDiv.style.display = 'block';
    rowDiv.style.lineHeight = '0';

    rowArr.forEach((ch, ci) => {
      const cell = document.createElement('span');
      cell.className = 'cell';
      const [bg, fg] = TILE[ch] || DEFAULT_TILE;
      cell.style.background = bg;
      cell.style.color = fg;
      cell.textContent = ch;
      cell.dataset.r = ri;
      cell.dataset.c = ci;

      cell.addEventListener('mousedown', e => {
        isMouseDown = true;
        const newCh = e.button === 2 ? '.' : selectedChar;
        setCell(ri, ci, newCh, cell);
        e.preventDefault();
      });
      cell.addEventListener('mouseenter', e => {
        document.getElementById('status-bar').textContent =
          `行: ${ri+1}  列: ${ci+1}  文字: "${ch}"  ${TILE[ch]?.[3]||''}`;
        if (isMouseDown) setCell(ri, ci, selectedChar, cell);
      });
      cell.addEventListener('contextmenu', e => { e.preventDefault(); setCell(ri, ci, '.', cell); });

      rowDiv.appendChild(cell);
    });

    // 行番号
    const lineNum = document.createElement('span');
    lineNum.style.cssText = 'display:inline-block;width:28px;font-size:9px;color:#333;padding-left:4px;vertical-align:middle;';
    lineNum.textContent = ri+1;
    rowDiv.appendChild(lineNum);
    grid.appendChild(rowDiv);
  });

  document.getElementById('map-title').innerHTML =
    `🗺 マップビュー (${mapData[0]?.length||0}列 × ${mapData.length}行)&nbsp;<span style="font-size:11px;color:#555;">左クリック:配置 右クリック:消去</span>`;
}

function setCell(ri, ci, ch, cell) {
  if (!mapData[ri] || ci >= mapData[ri].length) return;
  mapData[ri][ci] = ch;
  const [bg, fg] = TILE[ch] || DEFAULT_TILE;
  cell.style.background = bg;
  cell.style.color = fg;
  cell.textContent = ch;
  cell.dataset.ch = ch;
}

document.addEventListener('mouseup', () => { isMouseDown = false; });

// =============================================
// マップデータ → テキスト
// =============================================
function exportToText() {
  const lines = document.getElementById('raw-text').value.split('\n');
  const comments = lines.filter(l => l.startsWith('//') || l.trim() === '').map(l => l.replace(/\r/,''));

  const mapLines = mapData.map(rowArr => rowArr.join(''));
  const output = [...comments, ...mapLines].join('\n');
  document.getElementById('raw-text').value = output;
}

function copyText() {
  exportToText();
  const text = document.getElementById('raw-text').value;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('status-bar').textContent = '✅ クリップボードにコピーしました！';
    setTimeout(() => document.getElementById('status-bar').textContent = '行: - 列: - 文字: -', 2000);
  });
}

function clearAll() {
  if (confirm('マップをクリアしますか？')) {
    mapData = [];
    document.getElementById('map-grid').innerHTML = '';
    document.getElementById('raw-text').value = '';
  }
}

function loadFile() { document.getElementById('file-input').click(); }
function onFileLoad(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('raw-text').value = ev.target.result;
    renderFromText();
  };
  reader.readAsText(file, 'utf-8');
}

// 初期化
buildPalette();
selectChar('.');

// village.txtを自動読み込み試行
fetch('../components/data/dungeon/village.txt')
  .then(r => r.text())
  .then(text => {
    document.getElementById('raw-text').value = text;
    renderFromText();
  })
  .catch(() => {
    document.getElementById('status-bar').textContent = 'village.txt を手動で読み込むか、テキストを貼り付けてください';
  });
</script>
</body>
</html>

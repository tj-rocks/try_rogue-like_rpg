SKILL_DATA:
  backstab:
    name: サイドアタック
    describe: 側面や背後を取った時に強い。正面から押し合うだけでは届かない相手に、位置取りで差をつける技。
  stun:
    name: スタン
    describe: クリティカルな一撃と噛み合うと相手を止める。短い隙を大きな差に変える技。
  counter:
    name: カウンター
    describe: 相手の攻めを受け止めて返す。待つだけではなく、誘ってから仕留めるための技。
  knockback:
    name: ノックバック
    describe: 相手との間合いをずらす。距離を制して、自分の得意な間合いに戻す技。
  lifesteal:
    name: ライフスティール
    describe: 与えた一撃が、そのまま生存力につながる。長く斬り合うほど頼れる技。

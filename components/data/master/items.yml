# ==============================================================================
# アイテムデータ定義 (items.yml)
# ==============================================================================
# CONSUMABLE_DATA, STAVE_DATA, LANTERN_DATA の各種アイテムを定義します。
# 
# 【各パラメータの説明】
# - name            : ゲーム内で表示されるアイテム名
# - effect / effect_type : アイテムの効果（heal_hp, antidote, fire など）
# - heal_amount     : HPの回復量 (効果が回復の場合)
# - recharge_amount : 杖の使用回数回復量
# - price           : ショップでの購入価格
# - selling_price   : ショップでの売却価格（未設定の場合は price // 3）
# - min_rank        : 対象となるギルドランク基準（自動で出現階層が算出されます）
# - rarity          : ドロップ率・出現率 (1〜8)
#                     1(20%), 2(15%), 3(10%), 4(7.5%), 5(5%), 6(3.5%), 7(0.2%), 8(0.1%)
# - image_path      : インベントリ等で表示するアイコン画像
# - sound           : 使用時の効果音
# - shop_buyable    : お店に商品として並ぶか (true/false)
# - max_stack       : インベントリで1枠に重なる最大数
# - category        : 内部カテゴリ (common, event など)
# - describe        : UIで表示される詳細説明文
# - floor_spawnable : ダンジョンの床に落ちているか (true/false)
# ==============================================================================


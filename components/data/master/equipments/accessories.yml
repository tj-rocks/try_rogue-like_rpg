# ==========================================
# アクセサリマスタデータ (accessories.yml)
#
# bonus は「ゼロの値を書かなくてよい」形式です。
# 効果がある項目だけを `common` / `skills` / `magic` に書いてください。
#
# 【設定できるボーナス項目ガイド】
# common:
#   aggro_mod
#   attack
#   accuracy_close
#   accuracy_range
#   crit_rate
#   hp
#   defense
#   block_chance_close
#   block_chance_ranged
#   lantern_bonus
#   regen
#   stupidity
#   armor_penetration
#   buff_value_ratio
#   buff_duration_ratio
#   trap_sense
#
# skills:
#   knockback:
#     count_knockback
#     knockback_proc_chance
#     knockback_max_distance
#   lifesteal:
#     count_lifesteal
#     lifesteal_chance
#     lifesteal_ratio
#   counter:
#     count_counter
#     counter_proc_chance
#     counter_damage_ratio
#   stun:
#     count_stun
#     stun_proc_chance
#     stun_duration
#   backstab:
#     count_backstab
#     backstab_crit_bonus
#     flank_backstab
#
# magic:
#   fire_damage
#   fire_range
#   heal_ratio
#   knockback_damage
#   invincible_turns
#   stave_bonus
#   light_stave_bonus
# ==========================================

ACCESSORY_CATEGORIES:
  accessory:
    position:
      hand_offsets:
        down: [[0, 0], [0, 0]]
        left: [[0, 0], [0, 0]]
        right: [[0, 0], [0, 0]]
        up: [[0, 0], [0, 0]]
      weapon_angles:
        down: [0, 0]
        left: [0, 0]
        right: [0, 0]
        up: [0, 0]
      draw_over_player:
        down: false
        left: false
        right: false
        up: false


# ==============================================================================
# クエストの仕組みとデータ定義 (quests.yml)
# ==============================================================================
# 当ゲームのクエストは大きく分けて3種類存在し、それぞれ管理場所が異なります。
# 
# 【1. 自動生成クエスト (ランダムクエスト)】
#   - ギルドボードを開くたびに自動生成される、日常的なクエストです。
#   - 生成ルールは `guild.yml` の各ランク設定 (`allowed_ranks`, `amount_range` 等) に依存します。
#   - 討伐(hunt) : 許可されたランクの敵からランダムに選ばれ、報酬は敵の強さから自動計算されます。
#   - 納品(delivery) : 許可されたランクのアイテムから選ばれ、報酬はアイテムの価格から自動計算されます。
# 
# 【2. 昇格クエスト (ランクアップ)】
#   - GPが規定値に達した際、ギルドマスターから受ける特別なクエストです。
#   - 昇格に必要な「証明書」などのアイテムは、`guild.yml` の `rank_up_item` で指定されています。
#   - (対象アイテムをドロップするボスを倒して持ち帰る、という流れを作れます)
# 
# 【3. 固定クエスト (FIXED_QUESTS)】
#   - 下記で定義する、条件を満たせば常に受注可能な静的クエストです。
#   - 特定のボス討伐などに使用します。（※enemies.ymlで max_concurrent: 1 に設定された敵を対象にするなど）
# 
# ------------------------------------------------------------------------------
# [FIXED_QUESTS のパラメータ説明]
# - id         : クエストの固有ID (クリア済み管理などに使用)
# - min_rank   : 受注可能な最小ギルドランク
# - max_rank   : 受注可能な最大ギルドランク
# - type       : クエストの種類 (hunt = 討伐, delivery = 納品)
# - target_key : 討伐対象の敵キー、または納品対象のアイテムキー
# - amount     : 必要数
# - reward_gold: 達成時の報酬ゴールド
# - reward_gp  : 達成時のギルドポイント獲得量
# - title      : UIで表示されるクエスト名
# ==============================================================================

# 実は enemies.yml（モンスターの設定）で、max_concurrent （同時に存在できる数）を 1 に設定したモンスターは、システム側で自動的に「ボス級モンスター」として扱われるようになっています。
# ボス級として判定されると、フロアを生成した際に**「その階層で一番面積が広い部屋」の中心に確定でスポーンする（配置される）**というロジックが enemy.py で動いています。（現在は dragon_boss などがこの設定になっています）
# ですので、「ボス討伐クエスト」を作る場合は：
# enemies.yml でボスの max_concurrent: 1 を設定し、特定の階層（min_floor〜max_floor）に出現するようにする。
# quests.yml の FIXED_QUESTS に、そのボスのIDを target_key とした討伐（hunt）クエストを追加する。

FIXED_QUESTS:
  # --- 以下、ボス討伐クエスト ---
  - id: boss_hunt_suisui_slime
    min_rank: F
    max_rank: D
    type: hunt
    target_key: suisui_slime
    amount: 1
    reward_gold: 500
    reward_gp: 50
    title: スイスイスライムの討伐
    requester: ギルドマスター
    description: "ダンジョン深層に現れるという、驚異的な回避能力を持つスライムを討伐してください (想定階層: 10F)"
    report_message: "見事に依頼を達成しましたね！\nあの素早いスライムを仕留めるとは…\nお見事です！"
    repeatable: true
    chance: 1.0
    ending: false

  - id: boss_hunt_sukesuke_skeleton
    min_rank: E
    max_rank: C
    type: hunt
    target_key: sukesuke_skeleton
    amount: 1
    reward_gold: 1500
    reward_gp: 150
    title: スケスケスケルトンの討伐
    requester: ギルドマスター
    description: "ダンジョンに現れる姿の薄いスケルトンを討伐し、その脅威を排除してください (想定階層: 20F)"
    report_message: "お見事です！\nあの不気味な骸骨を倒しましたか…\nこれで冒険者たちも安心ですね"
    repeatable: true
    chance: 1.0
    ending: false

  - id: boss_hunt_deka_komori
    min_rank: C
    max_rank: B
    type: hunt
    target_key: deka_komori
    amount: 1
    reward_gold: 2500
    reward_gp: 250
    title: デカコウモリの討伐
    requester: ギルドマスター
    description: "ダンジョン中層に現れるという、猛毒を持つ巨大なコウモリを討伐してください (想定階層: 35F)"
    report_message: "あの巨大なコウモリを…！\n毒にやられなかったですか？\n大したものですね！"
    repeatable: true
    chance: 1.0
    ending: false

  - id: boss_hunt_gogo_ghost
    min_rank: D
    max_rank: C
    type: hunt
    target_key: gogo_ghost
    amount: 1
    reward_gold: 2000
    reward_gp: 200
    title: ゴーゴーゴーストの討伐
    requester: ギルドマスター
    description: "ダンジョン中層に現れるという、高速で突進してくる亡霊を討伐してください (想定階層: 30F)"
    report_message: "あの速さの亡霊を捕らえましたか！\nたいした腕前ですね！"
    repeatable: true
    chance: 1.0
    ending: false
  # --- 最深部ボス討伐クエスト ---
  - id: boss_hunt_undead_father
    min_rank: B
    max_rank: SS
    type: hunt
    target_key: undead_father
    amount: 1
    reward_gold: 5000
    reward_gp: 50
    title: 魂を失った亡者の討伐
    requester: ギルドマスター
    description: "50階に彷徨う強力な亡霊を討伐し、安らかな眠りを与えてください"
    report_message: "…そうですか。あなたが倒すとは、運命とは皮肉ですね。\n…いえ、何でもありません。\nお疲れ様でした。"
    repeatable: false
    chance: 1.0
    ending: true

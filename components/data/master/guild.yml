# ==============================================================================
# ギルドランク設定マスタ (guild.yml)
# ==============================================================================
# 各ランクのステータス、クエスト受注制限、および「到達可能階層」を定義します。
#
# 【重要：limit_floor について】
# この値に基づき、constants.py がエネミーの出現範囲を自動計算します。
# - そのランクの敵が出る開始階: 前のランクの limit_floor + 1
# - そのランクの敵が出る終了階: そのランクの limit_floor + 2 (オーバーラップ)
#
# 【各パラメータの説明】
# - rank             : ランク名 (F 〜 SS)
# - required_gp      : 昇級に必要なギルドポイント(GP)
# - allowed_ranks    : 掲示板に並ぶクエストのランク範囲
# - reward_multiplier: クエスト達成報酬の倍率
# - amount_range     : 掲示板に並ぶクエストの数 [最小, 最大]
# - limit_floor      : このランクでの「到達可能最大階層」
# - required_gp      : そのランクへの「昇級試験を受ける」ために必要な累積GP
# - rank_up_item     : 昇級試験で回収を求められるアイテム
# ==============================================================================


# ==============================================================================
# 障害物データ (obstacles.yml)
# ==============================================================================
# 【各パラメータの説明】
# - name          : ゲーム内に表示される名前。
# - rank          : 強さランク (F〜SS)。出現階層の自動計算に使用されます。
# - hp            : 耐久力。0になると破壊されます。playerの攻撃力の倍数を設定します。
# - defense       : 防御力。ダメージからこの値が引かれます。
# - evasion       : 回避率。攻撃を避ける確率。通常は 0。
# - crit_rate     : 会心率（0.0 〜 1.0）。障害物の場合は通常 0.0。
# - reward_gold   : 破壊（クエスト対象時）の基本報酬額。
# - exp           : 破壊時に得られる経験値。
# - min_floor     : 出現開始階。nullの場合はrankから自動計算。
# - max_floor     : 出現終了階。nullの場合はrankから自動計算。
# - max_concurrent: その階に同時に存在できる最大数。
# - max_spawns    : その階で合計で出現する最大数。
# - drops         : 破壊時に落とすアイテムのリスト。
#                   敵と同じように normal/rare の辞書形式にします。
#                   common キー配下にデフォルト設定を配置し、ランク名キーで上書き可能です。
# - image_path    : 画像ファイルへのパス。
# - image_scale   : 表示サイズのスケーリング (1.0 = 標準)。
# ==============================================================================


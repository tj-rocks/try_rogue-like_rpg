# ==============================================================================
# ダンジョン・罠 データ (dungeon.yml)
# ==============================================================================
# 【リファレンス：ランク別 到達可能階層】(guild.yml 定義)
# - F ランク: 〜 11F
# - E ランク: 〜 21F
# - D ランク: 〜 30F
# - C ランク: 〜 40F
# - B ランク: 〜 55F
# - A ランク: 〜 70F
# - S ランク: 〜 80F
# - SS ランク: 〜 99F
#
# 【TRAP_DATA パラメータ】
# - name       : 罠の名前
# - weight     : 出現確率の重み（大きいほど出やすい）
# - damage     : ダメージ量（ダメージ床 等）
# - status     : 付与する状態異常（毒 等）
# - color      : デバッグ描画やパーティクル用色 [R, G, B]
# - sound      : 発動時の効果音
# - image_path : 罠の画像パス
#
# 【DUNGEON_IMAGES パラメータ】
# 階層（'0', '1' などの階層キー）ごとのマップ環境設定
# - image                : 床・壁テクスチャのテーマ
# - sound                : その階層のBGM
# - brightness           : 視界の広さ（大きいほど明るい）
# - map                  : 固定マップファイルの指定（nullでランダム生成）
# - wall_decoration_ratio: 壁に松明などの装飾が付く確率
# ==============================================================================

TRAP_DATA:
  pitfall:
    name: 落とし穴
    weight: 20
    color:
    - 40
    - 40
    - 40
    sound: components/sounds/sfx/fall.wav
    image_path: components/pictures/trap/pitfall.png
  damage_floor:
    name: ダメージ床
    weight: 50
    damage: 10
    color:
    - 150
    - 0
    - 0
    sound: components/sounds/sfx/damage.wav
    image_path: components/pictures/trap/damage_floor.png
  mine:
    name: 地雷
    weight: 30
    color:
    - 150
    - 150
    - 0
    sound: components/sounds/sfx/explosion.wav
    image_path: components/pictures/trap/mine.png
  poison_trap:
    name: 毒矢の罠
    weight: 40
    status: poison
    damage: 5
    color: [180, 0, 255]
    sound: components/sounds/sfx/damage.wav
    image_path: components/pictures/trap/damage_floor.png
  flood_switch:
    name: 怪しいスイッチ
    weight: 0
    color: [0, 200, 255]
    sound: components/sounds/sfx/click.wav
    image_path: components/pictures/trap/switch.png

DUNGEON_IMAGES:

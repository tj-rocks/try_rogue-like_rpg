# ==============================================================================
# EQUIPMENT PARAMETER DEFINITIONS (装備品パラメータ定義メモ)
# ==============================================================================
# name           : 表示名
# category       : カテゴリ（heavy, medium, light, robe, etc.）
# min_rank       : 装備可能な最小ランク (F, E, D, C, B, A, S, SS)
# rarity         : レアリティ（1〜5程度、ドロップ率や特殊演出に影響）
# defense_bonus  : 防御力。ダメージを直接減算する
# hp_bonus       : 最大HPの増加量（負の値で減少も可）
# regen_bonus    : 自然回復ブースト。1ターンごとに regen_pool に加算される量。
#                  (0.05が基本値。0.2なら合計0.25になり、4歩で1回復する)
# eva_bonus      : 回避率ボーナス。整数値（15 なら 15% 上昇）
# crit_bonus     : クリティカル率。実数値（0.05 なら 5% 上昇）
# aggro_mod      : 敵の感知しやすさ（現在は実験的なパラメータ）
# price          : 売買価格（売却時はこの半額）
# shop_buyable   : 店に並ぶかどうか (true/false)
# describe       : 詳細説明フレーバーテキスト
# ==============================================================================


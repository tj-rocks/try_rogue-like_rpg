# --- 主要施設NPC ---
dedicated_weapon_shop:
  name: 武器屋
  image_path: components/pictures/npc/main_weapon_armor_shop
  dialogue:
    default:
      - 武器屋： うちは武器の専門店だ！最高の業物を取り揃えているぜ
  role: dedicated_weapon_shop

dedicated_armor_shop:
  name: 防具屋
  image_path: components/pictures/npc/main_weapon_armor_shop
  dialogue:
    default:
      - 防具屋： 命あっての物種だ
      - 防具屋： うちは頑丈な鎧と盾の専門店だよ
  role: dedicated_armor_shop

dedicated_accessory_shop:
  name: アクセサリ屋
  image_path: components/pictures/npc/main_accessory_shop
  dialogue:
    default:
      - アクセサリ屋： いらっしゃい
      - アクセサリ屋： 不思議な加護を宿す装飾品の専門店です
  role: dedicated_accessory_shop

weapon_shop:
  name: 武器屋
  image_path: components/pictures/npc/main_weapon_armor_shop
  dialogue:
    default:
      - 武器屋： いらっしゃい！何にする？
  role: weapon_shop

item_shop:
  name: 道具屋
  image_path: components/pictures/npc/main_item_shop
  dialogue:
    default:
      - 道具屋： 旅の準備は整ったかい？
  role: item_shop

merchant:
  name: 商人
  image_path: components/pictures/npc/main_merchant
  dialogue:
    default:
      - 商人： ダンジョンで拾ったお宝は俺が買い取ってやるぜ！
  role: merchant

storage:
  name: 預かり屋
  image_path: components/pictures/npc/main_storage
  dialogue:
    default:
      - 預かり屋： 荷物を預かろうか？
  role: storage

inn:
  name: 宿屋
  image_path: components/pictures/npc/guide_doctor
  dialogue:
    default:
      - 宿屋： ゆっくり休んでいってね
  role: inn

blacksmith:
  name: 鍛冶屋
  image_path: components/pictures/npc/main_blacksmith
  dialogue:
    default:
      - 鍛冶屋： 俺ぁ鍛冶屋だ 鉱石を持ってこれば装備を叩き直してやるぜ
  role: blacksmith

# villager:
#   name: 村人
#   image_path: components/pictures/npc/girl_town_v
#   dialogue:
#     default:
#       - 村人： この先は危険だよ 1Fへ行くするには右の階段を使ってね

guild_receptionist:
  name: ギルド受付
  image_path: components/pictures/npc/guild_receptionist
  dialogue:
    default:
      - ギルド受付： ようこそ冒険者ギルドへ
  role: guild_receptionist

guild_rankup_officer:
  name: 昇給試験担当
  image_path: components/pictures/npc/guild_rankup_officer
  dialogue:
    default:
      - 昇給試験担当： 昇給試験担当です
  role: guild_rankup

# guild_master:
#   name: ギルドマスター
#   image_path: components/pictures/npc/man_middleage_h
#   dialogue:
#     default:
#       - ギルドマスター： よくぞ来た、若き冒険者よ ギルドへ歓迎する！
#   role: guild_receptionist

doctor:
  name: 医者
  image_path: components/pictures/npc/main_doctor
  dialogue:
    default:
      - 医者： ……気がついたかい？無茶はしちゃいけないよ
  role: doctor

bank:
  name: 銀行員
  image_path: components/pictures/npc/main_bank
  dialogue:
    default:
      - 銀行員： 大切なお金をお預かりします
  role: bank

wizard:
  name: 魔法屋
  image_path: components/pictures/npc/main_masic
  dialogue:
    default:
      - 魔法屋： 杖を振る時は、その残数をよく確認してください 空の杖を振っても何も起きません
  role: magic_shop

teleport_wizard:
  name: テレポート屋
  image_path: components/pictures/npc/main_teleport
  dialogue:
    default:
      - テレポート屋： どこの休憩所にとぶんだい？転移の石を持ってくれば飛ばしてあげるよ 有料でね
  role: teleport

priest:
  name: 神官
  image_path: components/pictures/npc/main_priest
  dialogue:
    default:
      - 神官： 私は神の奇跡によって、あなたの死の呪いを祓うことができます
  role: priest

# --- チュートリアル担当NPC群 ---
crank_adventurer:
  name: 中堅冒険者
  image_path: components/pictures/npc/tutor_adventure_1
  dialogue:
    default:
      - 中堅冒険者： はあ俺も早くランクアップしたいけど手強い敵が多いなあ
    E:
      - 中堅冒険者： よぉ新人！ 冒険の準備は進んでるか？ まずはギルドに所属しないとダンジョンに入ることすらできないぞ
      - 中堅冒険者： それと、装備はケチるなよ 身の丈に合った武器と防具を武器屋できちんと揃えるんだ 裸同然で潜るのは自殺志願者だけだ
      - 中堅冒険者： あと、一番大事なのは『引き際』だ 欲張って深くに行きすぎるなよ 自分の限界を感じたら、早めに引き返すのがプロの冒険者ってやつだ！

crank_adventurer2:
  name: 先輩冒険者
  image_path: components/pictures/npc/tutor_adventure_2
  dialogue:
    default:
      - 先輩冒険者： あら、新人君？ 冒険者らしくなってきたじゃない 先輩から一つ、身に染みるアドバイスをあげるね
      - 先輩冒険者： ダンジョンで死ぬと呪われるけど、神官に話しかければ直してくれるわよ
      - 先輩冒険者： でもギルドポイントの1/5を支払わなきゃいけないの
      - 先輩冒険者： 新人のうちはいいけどランクが上がると辛いわよね
      - 先輩冒険者： あと、HPが減ったら絶対に無理しないで、すぐに街へ戻るか回復すること 回復薬をケチって全滅するなんて、一番ダサいんだからね？

guide_inn:
  name: 宿屋の看板娘
  image_path: components/pictures/npc/guide_doctor
  dialogue:
    default:
      - 宿屋の看板娘： 冒険に疲れたら泊まっていってください

guide_guild:
  name: ギルド職員
  image_path: components/pictures/npc/guide_guild_1
  dialogue:
    default:
      - ギルド職員： まずはギルドで『クエスト』を受けて、冒険の目的を決めましょう
      - ギルド職員： クエストを達成してポイントを貯めれば、より深い階層への通行許可が下りるわよ

guide_doctor:
  name: 医療助手
  image_path: components/pictures/npc/guide_doctor
  dialogue:
    default:
      - 医療助手： もしダンジョンでHPが0になっても、お医者様がここまで運んでくれるわ
      - 医療助手： ただし、持っていたコインや一部のアイテムを失うこともあるから注意してね

guide_bank:
  name: 村人
  image_path: components/pictures/npc/villager_1
  dialogue:
    default:
      - 村人： 手持ちのコインを銀行に預けておけば、倒れた時でも没収されずに済むよ
      - 村人： まとまったお金が手に入ったら、こまめに預けに来るのが冒険者の知恵だね

guild_guide:
  name: ギルド職員
  image_path: components/pictures/npc/guide_guild_1
  dialogue:
    default:
      - ギルド職員： 冒険者ギルドへようこそ
      - ギルド職員： 新たな冒険者さんを歓迎するわ
      - ギルド職員： クエストを達成してランクを上げれば、より深い階層へ進めるようになるわ！
      - ギルド職員： 受付でクエストを受注できますよランクアップ目指して頑張ってくださいね
  role: guild_guide

pub_master:
  name: パブのマスター
  image_path: components/pictures/npc/tutor_pub
  dialogue:
    default:
      - パブのマスター： ようこそいらっしゃい、冒険者さん ここは冒険者の疲れを癒すパブさ
      - パブのマスター： 冒険者は危険も少なく稼ぎもでかい いい仕事だね
      - パブのマスター： 嫌なことがあったらここにきて、うまい酒を飲んで忘れちまいな

guild_staff:
  name: ギルド職員
  image_path: components/pictures/npc/guide_guild_1
  dialogue:
    default:
      - ギルド職員： ダンジョンで死んでも諦めないでください ダンジョンの呪いはかかりますが生きて帰れます
      - ギルド職員： もし呪いにかかってしまったら、ギルドにいる神官様に解いてもらいましょう
      - ギルド職員： とはいえ迷宮から帰ってこない冒険者もいます お気をつけて

# --- ストーリー担当NPC ---

story_yuru:
  name: ユル
  image_path:
    default: components/pictures/npc/story_yuru
    A: components/pictures/enemies/slime
    S: components/pictures/enemies/slime
  alpha:
    F: 255
    E: 255
    D: 220
    C: 150
    B: 80
  dialogue:
    F:
      - ユル： 希望に燃えている！冒険者って最高だな！
    E:
      - ユル： なんだか最近、ダンジョンの壁が高く感じるよ……
    D:
      - ユル： ああ、呪いにかかってしまった……治るのかな？
    C:
      - ユル： なんだか体が薄くなってきてる気がする
      - ユル： 寿命が減ってるのかな……
    B:
      - ユル： ギルドポイントを使っても、もう呪いが治せない状態なんだ……
    A:
      - ユル： （体が少しずつ変異している……モンスター化が始まっているようだ）
    S:
      - ユル： ギョルル……グルルル……（完全にモンスター化してしまった）

story_kaya:
  name: カヤ
  image_path: 
    default: components/pictures/npc/story_kaya
    A: components/pictures/npc/guide_guild_1
  dialogue:
    F:
      - カヤ： 私も立派な冒険者になるの！
    E:
      - カヤ： もう無理……敵が強すぎるわ……
    D:
      - カヤ： ごめんなさい……私、もうこの辺で諦めようと思うの……
    A:
      - ギルド職員： カヤ？ 彼女は冒険者を辞めて田舎に帰ったわ
      - ギルド職員： 賢明な判断ね。

story_rain:
  name: レイン
  image_path:
    default: components/pictures/npc/story_rain
    A: components/pictures/weapon/iron_sword.png
    S: components/pictures/weapon/iron_sword.png
  alpha:
    F: 255
    E: 255
    D: 255
    C: 255
    B: 128
  dialogue:
    F:
      - レイン： アイテムの使い方なら俺に聞きな！
    E:
      - レイン： 霊薬の使い方にもコツがあるんだぜ
    D:
      - レイン： これ以降は装備の組み合わせが鍵になる
      - レイン： よく考えな！
    C:
      - レイン： おっ、お前もずいぶん強くなったな！
    B:
      - レイン： なんだか最近体が透けてきた気がするけど、まあ大丈夫さー！
    A:
      - レイン： （体が硬直して、剣の形になり始めている……）
    S:
      - レイン： （そこには、彼の面影を残した一振りの剣だけが落ちている）

story_helena:
  name: ヘレナ
  image_path: 
    default: components/pictures/npc/story_helena
    A: components/pictures/npc/guide_guild_1
  alpha:
    F: 255
    E: 255
    D: 255
    C: 255
    B: 128
  dialogue:
    F:
      - ヘレナ： 呪いは面倒だけど、生きて帰れるから安全よ
    E:
      - ヘレナ： ギルドポイントを失うけど、命には代えられないわ
      - ヘレナ： 大したことないわよ
    D:
      - ヘレナ： ギルドポイントが少なくなってきた……なんだか不安ね
    C:
      - ヘレナ： HPが少なくなりすぎて、もうモンスターを倒せなくなってきたわ……
    B:
      - ヘレナ： もうだめ……限界かもしれない……
    A:
      - ギルド職員： ああ、彼女なら冒険者を引退したそうよ。

story_olivia:
  name: オリヴィア
  image_path: 
    default: components/pictures/npc/story_olivia
    A: components/pictures/npc/guide_guild_1
  alpha:
    F: 255
    E: 255
    D: 255
    C: 255
    B: 128
  dialogue:
    F:
      - オリヴィア： 呪いのリスクをよく考えることね
      - オリヴィア： まあ、今のうちは呪われても大したことないけど
    E:
      - オリヴィア： チュートリアルは終わりよ
      - オリヴィア： 慣れてきた頃が一番危険だぞ
    D:
      - オリヴィア： 呪いには気をつけて
      - オリヴィア： ランクが上がれば上がるほど、そのリスクは跳ね上がるわ
    C:
      - オリヴィア： 呪いの本当の意味について……そろそろお前も気づいてるんじゃないか？
    B:
      - オリヴィア： ダンジョンでは死なないって言われているけど、帰ってこない奴はたくさんいる
      - オリヴィア： 死体も見つからない
      - オリヴィア： 何かおかしいと思わないか？
    A:
      - オリヴィア： 答え合わせだ
      - オリヴィア： ヘレナは私の目の前で死んだ……何が起きたと思う？ 私の口からは話せないわ
    S:
      - ギルド職員： あの人なら、もう冒険者を引退したわよ。

story_geisel:
  name: ガイゼル
  image_path:
    default: components/pictures/npc/story_geisel
    S: components/pictures/enemies/slime
  dialogue:
    F:
      - ガイゼル： お前の父は偉大だったぞ
    E:
      - ガイゼル： お前の父は、ギルドや仲間から本当に信頼されるすごい冒険者だった
    D:
      - ガイゼル： お前の父は、仲間の死について深く調べていたようだった……
    C:
      - ガイゼル： お前の父親は、もしかしたらまだダンジョンを彷徨っているのかもしれないな
    B:
      - ガイゼル： 50Fに強力な亡霊がいる。おそらくお前の父親だ
      - ガイゼル： ギルドで亡霊のクエストを受けられるはずだ それで会える・・・
      - ガイゼル： お前の手で葬ってやれ 決着をつけてこい
    A:
      - ガイゼル： もう俺は……地上には帰れない
    S:
      - ガイゼル： スライム化が始まってしまった
      - ガイゼル： 俺の人生もそろそろ終幕だ……
    SS:
      - ガイゼル： 頼む、ダンジョンコアにとどめをさしてくれ……！

story_camila:
  name: カミラ
  image_path: components/pictures/npc/story_camila
  dialogue:
    F:
      - カミラ： ギルドは俺たちに本当の情報を与えてくれないわ
    E:
      - カミラ： 呪いは皆が思っているような、優しいものではないかもしれない……
    D:
      - カミラ： お前の父親は、あの真相に辿り着いていたのかもしれないわね
    C:
      - カミラ： 呪いとは、もしかして……
    B:
      - カミラ： 深く潜れば、お前の父親に会えるかもしれない
    A:
      - カミラ： 呪いとは、ダンジョンが生きるために魂を回収するシステムよ
      - カミラ： 回復の見込みがある奴だけが地上に戻される
      - カミラ： ギルドが呪いを解く術を持っているのはなぜだと思う？
    S:
      - カミラ： ヘレナは、おそらくギルドに始末されたわ
      - カミラ： ギルドはダンジョンの真相に気づいた冒険者を殺すための人員を抱えているのよ
    SS:
      - カミラ： ダンジョンコアを破壊すればこの不幸な冒険者たちは報われる……
      - カミラ： でも、人類はダンジョンに頼って生きている それもまた現実なのよね
      - カミラ： 人類とは矛盾を抱える種族ね

story_gareth:
  name: ガレス
  image_path: components/pictures/npc/story_gareth
  dialogue:
    F:
      - ガレス： モンスターから、何か知ってる気配を感じることがあるんだ
    E:
      - ガレス： 呪いとは、いったいなんなのだろうな……
    D:
      - ガレス： ギルドの隠し事は、俺たちが思っているよりずっと大きいかもしれない
    C:
      - ガレス： 半分モンスターになっている冒険者を見たことがある気がする……
    B:
      - ガレス： お前の父はモンスターになった
      - ガレス： ……この意味がわかるか？
    A:
      - ガレス： ダンジョンは生き物なのかもしれない
      - ガレス： 生き物が食事をしないわけがないだろう？
    S:
      - ガレス： ダンジョンで死んだ冒険者の肉体は、アイテムやモンスターになってしまうんだ
      - ガレス： そして魂はダンジョンに食われる……それが呪いの正体だ
    SS:
      - ガレス： 俺もそろそろギルドに始末されるだろう
      - ガレス： 俺はダンジョンコアを倒すことに賛成だぞ

story_noname1:
  name: 冒険者
  image_path: components/pictures/npc/story_noname2
  dialogue:
    default:
      - 冒険者： 冒険って楽しいわね！
      - 冒険者： 死んだら地上に戻れて簡単だし
      - 冒険者： 呪いもすぐ治るし簡単な仕事だわ

story_noname2:
  name: 冒険者
  image_path: components/pictures/npc/story_noname1
  dialogue:
    default:
      - 冒険者： 銀行にお金を預けておけば死んでも残高は減らないんだ
      - 冒険者： 冒険は本当に金が稼げる、最高の仕事だぜ！

story_noname3:
  name: 冒険者
  image_path: components/pictures/npc/story_noname2
  dialogue:
    default:
      - 冒険者： キラキラした宝石がたくさんあって素敵ね！
      - 冒険者： 冒険者を引退したら商人になってたくさん儲けるぞ！
    C:
      - 冒険者： ギルドの言うことを聞くのよ
      - 冒険者： 呪いを解く術を持っているのは、ギルドだけなのだから
    B:
      - 冒険者： 結局ギルド無しでは我々は暮らしていけないんだね
      - 冒険者： ダンジョンかのアイテムを高く売ることも販売をするのもギルドに頼っている
      - 冒険者： 少なくともギルドは誠実にお金を払ってくれるだろ
    A:
      - 冒険者： 結局ギルド無しでは我々は暮らしていけないんだね
      - 冒険者： ダンジョンかのアイテムを高く売ることも販売をするのもギルドに頼っている
      - 冒険者： 少なくともギルドは誠実にお金を払ってくれるだろ
    S:
      - 冒険者： ダンジョンの呪いをギルドだけが解けるのがおかしいって？
      - 冒険者： だいたい理由なんて察しがついてるんだろう？
      - 冒険者： そんなこと知ったからってろくなことにならないぞ
      - 冒険者： 重要なのは生き残ることさ
    SS:
      - 冒険者： 結局ギルド無しでは我々は暮らしていけないんだね
      - 冒険者： ダンジョンかのアイテムを高く売ることも販売をするのもギルドに頼っている
      - 冒険者： 少なくともギルドは誠実にお金を払ってくれるだろ

story_noname4:
  name: 冒険者
  image_path: components/pictures/npc/story_noname2
  dialogue:

# ==============================================================================
# ストーリーデータ定義 (story.yml)
# ==============================================================================
# オープニング(opening)とエンディング(ending)の各シーンのテキストとBGMを定義します。
# 
# 【構成】
# - opening / ending:
#   - インデックス番号 (1, 2, 3...): opening_1.png 等に対応
#     - text: 表示するテキスト（改行可）
#     - bgm: そのシーンで再生するBGM名 (省略時は前のシーンを継続)
# ==============================================================================

opening:
  1:
    text: "古より、この世界には「ダンジョン」が存在した \n人々は富と名声を求め、その深淵へと足を踏み入れた"
    bgm: "components/sounds/bgm/winding_adventure.mp3"
  2:
    text: "ダンジョンからもたらされる神秘のアイテムは人々に恩恵を与え、\n独自の文化を築き上げていった"
    bgm: "components/sounds/bgm/winding_adventure.mp3"
  3:
    text: "潜るたびに姿を変え、未知の秘宝を生み出す不思議な空間 \nそこを往く者たちはいつしか「冒険者」と呼ばれた"
    bgm: "components/sounds/bgm/winding_adventure.mp3"
  4:
    text: "時は流れ、探索を管理する「冒険者ギルド」が設立されると、\nダンジョン探索は国家規模で体系化されていった"
    bgm: "components/sounds/bgm/winding_adventure.mp3"
  5:
    text: "だが、栄光を掴む者の陰で、数多の冒険者たちが帰らぬ人となった"
    bgm: "components/sounds/bgm/winding_adventure.mp3"
  6:
    text: "これは、行方不明となった父の背中を追い、\n冒険者の道を志した一人の若者の物語……"
    bgm: "components/sounds/bgm/winding_adventure.mp3"
  7:
    text: "深淵を目指すための第一歩 \nまずは「冒険者ギルド」の入会テストを突破しなければならない"
    bgm: "components/sounds/bgm/winding_adventure.mp3"

ending:
  father:
    1:
      image: "components/pictures/ending/father_1.png"
      text: "ついに君は、父の亡霊と向き合い\n失われた時間の答えを受け取った"
      bgm: "components/sounds/bgm/winding_adventure.mp3"
    2:
      image: "components/pictures/ending/father_2.png"
      text: "もう追うだけの旅ではない。\n君は、父の願いを抱いて歩き出す"
      bgm: "components/sounds/bgm/winding_adventure.mp3"
    3:
      image: "components/pictures/ending/father_3.png"
      text: "冒険は続く。\nけれど、君の足取りはもう迷っていない"
      bgm: "components/sounds/bgm/winding_adventure.mp3"
  core:
core:
  1:
    image: "components/pictures/ending/core_1.png"
    text: "世界はダンジョンを一つ失った。\nそれは、一つの時代が終わったということだった。"
    bgm: "components/sounds/bgm/winding_adventure.mp3"
  2:
    image: "components/pictures/ending/core_2.png"
    text: "ほどなくして、村は姿を失った。\n商人も、武器屋も、冒険者も、\nあの場所に寄りかかっていた営みは、静かに消えていった。"
    bgm: "components/sounds/bgm/winding_adventure.mp3"
  3:
    image: "components/pictures/ending/core_3.png"
    text: "君の決断は、何かを救い、何かを終わらせた。\n意義があったのか、必要だったのか。\nその答えは、簡単には出ない。"
    bgm: "components/sounds/bgm/winding_adventure.mp3"
  4:
    image: "components/pictures/ending/core_2.png"
    text: "正しかったか正しくないかは、あとから誰かが決める。\nだが、決めて動いた事実だけは残る。\n君は、確かにそれをやった。"
    bgm: "components/sounds/bgm/winding_adventure.mp3"

core_refuse:
   1:
     image: "components/pictures/ending/core_refuse_1.png"
     text: "君は、ダンジョンコアを壊さない道を選んだ。\nここで何を残すかを、先に決めたということだ。"
     bgm: "components/sounds/bgm/winding_adventure.mp3"
   2:
     image: "components/pictures/ending/core_refuse_2.png"
     text: "ダンジョンはこの世界に数多くある。\nここ一つを壊したところで、すべてが変わるわけではない。\nだが、この村で続いていた何かは、まだ壊さずに済んだ。"
     bgm: "components/sounds/bgm/winding_adventure.mp3"
   3:
     image: "components/pictures/ending/core_refuse_3.png"
     text: "君の決断は、村を丸ごと終わらせるかわりに、\nしばらくは今のまま生かすことを選んだ。\n正しいかどうかは、簡単には言えない。"
     bgm: "components/sounds/bgm/winding_adventure.mp3"
   4:
     image: "components/pictures/ending/core_refuse_2.png"
     text: "正しかったか正しくないかは、あとから誰かが決める。\nだが、決めて動いた事実だけは残る。\n君は、確かにそれをやった。"
     bgm: "components/sounds/bgm/winding_adventure.mp3"
# stupidity: 10 の場合 → 10/10 = 100% の確率でボケる（完全にランダム移動）
# stupidity: 1 の場合 → 1/10 = 10% の確率でボケる（たまにボケる）
# stupidity: 0 の場合 → 0%（常に完璧に動く）
# 
# attack_priority: 攻撃の優先思考スタイル
#   - close: インファイター。射程に関わらず隣接（距離1）することを最優先する。
#   - ranged: アウトボクサー。理想の間合い（射程-1）を保ちながら戦うことを優先する。
# 
# attack_range: 隣接攻撃は 1。遠距離はそれ以上の数値を設定。


